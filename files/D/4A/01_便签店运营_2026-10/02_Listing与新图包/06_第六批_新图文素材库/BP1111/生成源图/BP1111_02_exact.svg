="875" font-size="32" font-weight="400" text-anchor="middle" fill="#14212b">of a 3 × 3 in note</text><text x="1685" y="1060" font-size="70" font-weight="700" text-anchor="middle" fill="#14212b">4 pads</text><text x="1685" y="1150" font-size="37" font-weight="400" text-anchor="middle" fill="#14212b">30 sheets each</text><text x="1685" y="1280" font-size="70" font-weight="700" text-anchor="middle" fill="#14212b">120</text><text x="1685" y="1340" font-size="37" font-weight="400" text-anchor="middle" fill="#14212b">sheets total</text><text x="1000" y="1700" font-size="51" font-weight="600" text-anchor="middle" fill="#14212b">Pink · Yellow · Blue · Mint green</text><text x="1000" y="1810" font-size="42" font-weight="400" text-anchor="middle" fill="#14212b">Room for notes, sketches and shared plans.</text><text x="1000" y="1920" font-size="29" font-weight="400" text-anchor="middle" fill="#65737c">Area comparison: 121 ÷ 9 = 13.44. Both paper sizes use the same scale.</text></g></svg>